name: CI

on:
  push:
  pull_request:

jobs:
  headless-tests:
    name: AI tests (plain .NET, no Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Tools/Headless/Cascade.Headless.Tests.csproj --logger "console;verbosity=normal"

  unity-tests:
    name: Unity EditMode + PlayMode
    runs-on: ubuntu-latest
    # Requires UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets (see game-ci documentation).
    if: ${{ vars.RUN_UNITY_TESTS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
